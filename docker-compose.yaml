services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # WP6（Step 3）：PostgreSQL 服务已移除，运行时后端固定 memory
      # （KB 经验由本地 SQLite 笔记本持久化，KB_PERSIST_ENABLED 默认开启）
      STORAGE_BACKEND: memory
      STATE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      API_KEY: ${API_KEY:?必须设置}
    ports:
      # FIX(v0.7.1-b6-8): 仅绑定回环 127.0.0.1（对齐 prod compose），不再向
      # 局域网/公网暴露 app 端口——开发环境也避免 API Key 明文 HTTP 意外外泄。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
