services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lujo_mcp
      POSTGRES_USER: postgres
      # FIX(v0.7.1-b5-8): 双密码变量易踩坑——postgres 用 POSTGRES_PASSWORD、app 用
      # PG_PASSWORD，两个都得设（只设一个另一服务启动即失败）。此处加回退：二选一即可，
      # 二者语义等价（应用只读 PG_*，POSTGRES_PASSWORD 仅用于 DB 初始化）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${PG_PASSWORD:?必须设置 PG_PASSWORD 或 POSTGRES_PASSWORD}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lujo_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: postgresql
      STATE_BACKEND: redis
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: lujo_mcp
      PG_USER: postgres
      # FIX(v0.7.1-b5-8): 与 postgres 服务对称回退——只设 POSTGRES_PASSWORD 也能驱动
      # app 连接（二选一即可，消除双密码变量必须同时设置的踩坑点）。
      PG_PASSWORD: ${PG_PASSWORD:-${POSTGRES_PASSWORD:?必须设置 PG_PASSWORD 或 POSTGRES_PASSWORD}}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      API_KEY: ${API_KEY:?必须设置}
    ports:
      # FIX(v0.7.1-b6-8): 仅绑定回环 127.0.0.1（对齐 prod compose），不再向
      # 局域网/公网暴露 app 端口——开发环境也避免 API Key 明文 HTTP 意外外泄。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
