name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # 2026-09-09 WP①：actions 升到消除 Node 20 弃用告警的最低安全主版本。
      # checkout v5 = node24；v5/v6 的 fork PR checkout 收紧仅涉
      # pull_request_target / workflow_run，本仓库用普通 pull_request / tag push，不受影响。
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-locked.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ruff 硬门禁（v0.6.8 起）：规则集由仓库根 ruff.toml 显式锁定，
      # requirements-dev.txt 同时锁定 ruff>=0.16.4,<0.17.0 —— 二者共同消除
      # 「ruff 升级改默认规则集导致本地绿 / CI 红」的历史问题（v0.6.3 的 776 项即由此而来）。
      # 升级 ruff 时必须同步改 requirements-dev.txt 并在本地复验 ruff check . 全绿。
      - name: Lint with ruff
        run: ruff check .

      # 文档链接检查（硬门禁）：扫描 git 跟踪的 Markdown 文件中的
      # [text](url) 链接，验证相对路径文件是否存在、是否误用 file://
      # 绝对路径等。只检查 git ls-files 列出的文件，确保 CI 与本地一致。
      # 失败时在 GitHub Actions 的 Annotations 面板逐条标注错误位置。
      - name: Check doc links
        run: python scripts/check_doc_links.py

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short --junitxml=test-results.xml

      # 全 skip 假绿守卫：内联 heredoc 已抽出为 scripts/check_junit_skip_guard.py，
      # 与下方 integration / e2e 两个测试 job 复用同一实现（v0.7.6 起）。
      - name: Print skip summary (guard against all-skip false-green)
        if: always()
        run: python scripts/check_junit_skip_guard.py test-results.xml

  # ── 集成测试门禁（v0.7.6 后补）───────────────────────────────────────────
  # 历史：CI 只跑 tests/unit，"integration 红而 CI 绿"的回归已发生过两次
  # （verify_ui 失败标记、redaction 字符串归一，曾在 f221d6d 上红两天无人知晓）。
  # tests/integration/conftest.py 默认强制 memory 后端，CI 无需真实
  # PostgreSQL/Redis/Qdrant；依赖真库的 pg 标记用例按自身 _require_pg 守卫
  # 自动 skip —— 允许部分 skip，全 skip 由守卫判红。
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-locked.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration -q -p no:cacheprovider --junitxml=integration-results.xml

      - name: Print skip summary (guard against all-skip false-green)
        if: always()
        run: python scripts/check_junit_skip_guard.py integration-results.xml

  # ── SDK Playwright e2e 门禁（v0.7.6 起进 CI）────────────────────────────
  # 真 Chromium 全链路：SDK 加载 → 埋点上报 → /ingest 入库。此前 CI 不跑 e2e，
  # 由 sdk-js-smoke 顶替；现补真实浏览器链路，sdk-js-smoke 保留为秒级快反馈。
  # conftest（tests/e2e）自起 uvicorn(127.0.0.1:8000) 并强制 memory 后端，
  # 无外部服务依赖；LLM 未配置的知识库用例自行 skip（1 条，不触发全 skip 守卫）。
  # playwright 与本地验证环境 pin 一致（升级时先本地复跑 tests/e2e 全绿再动）；
  # --with-deps 一并安装 Ubuntu 系统库，Chromium 下载约 150MB（接受该耗时）。
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-locked.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # e2e 专属依赖不进 requirements-dev.txt（其余 job 用不到），在此显式安装。
      - name: Install Playwright + Chromium
        run: |
          pip install "playwright==1.61.0"
          playwright install --with-deps chromium

      - name: Run e2e tests
        run: pytest tests/e2e -q -p no:cacheprovider --junitxml=e2e-results.xml

      - name: Print skip summary (guard against all-skip false-green)
        if: always()
        run: python scripts/check_junit_skip_guard.py e2e-results.xml

  # SDK JS 核心契约 smoke（TST-3）：Node 无浏览器加载 ai-debug.js，守护
  # 公开 API 面 / V5 传输配置 / _getPublicConfig 不含 apiKey 等契约。
  # 防止 SDK 演进（如闭包化配置）后 e2e 接口再次失联（Playwright e2e 已由
  # e2e-tests job 覆盖，本 job 是秒级快反馈的第一道契约防线）。
  sdk-js-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-node v5：node24 运行时；其 breaking（packageManager 字段自动缓存）
      # 对本仓库无影响——所有 package.json 均无 packageManager 字段。
      # 测试运行时 node 20 → 22（与本机验证环境一致，SDK/launcher 测试已本地预验）。
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 显式列出全部 SDK 测试文件（不用目录形式：node --test <dir> 在部分
      # Node 版本下按模块解析导致 MODULE_NOT_FOUND）。新增测试文件需在此登记，
      # 否则不受 CI 守护 —— v0.6.7 的传输修复测试曾因此漏出门禁。
      # FIX(v0.7.1-b1): 补登记 v0.6.9 漏掉的 sdk-destroy.test.js + 本批新增
      # sdk-minor-reuse.test.js，CI 与 npm test 文件清单保持一致。
      - name: Run SDK core contract tests
        run: >-
          node --test
          browser-sdk/test/sdk-core.test.js
          browser-sdk/test/sdk-events.test.js
          browser-sdk/test/sdk-transport.test.js
          browser-sdk/test/sdk-transport-fixes.test.js
          browser-sdk/test/sdk-batch-limit.test.js
          browser-sdk/test/sdk-destroy.test.js
          browser-sdk/test/sdk-minor-reuse.test.js
          browser-sdk/test/sdk-rejection.test.js

      # npm 启动器（bin/cli.js）契约测试：参数拼装、平台二进制两种落盘布局解析、
      # 以及终止信号转发（本 job 为 Linux runner，SIGTERM 用例会真实执行；
      # Windows 上宿主以 TerminateProcess 结束进程，该用例自行 skip）。
      - name: Run npm launcher contract tests
        run: node --test npm/test/launcher.test.js npm/test/platform-package-gen.test.js

  # Node SDK 运行时/模块门禁：每个 Node 版本只跑一次完整测试，随后在同一个
  # packed fixture 中分别验证 CJS 与 ESM 根入口，避免把昂贵测试重复跑六遍。
  # node-sdk 缺失、包名错误、test script 缺失或任一根入口不可导入都会直接失败，
  # 不允许用条件 skip 把未接入的 SDK 伪装成绿色。
  node-sdk:
    name: Node SDK / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate Node SDK manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f node-sdk/package.json
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("node-sdk/package.json", "utf8"));
          if (pkg.name !== "@lujoai/lujo-mcp-node-sdk") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (typeof pkg.scripts?.test !== "string" || pkg.scripts.test.trim() === "") {
            throw new Error("node-sdk/package.json must define a test script");
          }
          if (typeof pkg.engines?.node !== "string" || !pkg.engines.node.includes(">=18")) {
            throw new Error("Node SDK must declare Node >=18 support");
          }
          NODE

      - name: Install Node SDK dependencies
        working-directory: node-sdk
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Run Node SDK test suite
        run: npm test --prefix node-sdk

      - name: Pack and install Node SDK smoke fixture
        shell: bash
        env:
          SDK_PACKAGE_NAME: "@lujoai/lujo-mcp-node-sdk"
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          npm pack --silent --pack-destination "$pack_dir" "$GITHUB_WORKSPACE/node-sdk"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"

          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund "$tarball"

          node - <<'NODE'
          const assert = require("node:assert/strict");
          const sdk = require(process.env.SDK_PACKAGE_NAME);
          assert.equal(typeof sdk.createClient, "function", "CJS root export createClient");
          const client = sdk.createClient({ endpoint: "http://127.0.0.1:9" });
          for (const method of ["reportError", "reportNetworkError", "flush", "close"]) {
            assert.equal(typeof client[method], "function", `CJS client.${method}`);
          }
          client.close().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          const sdk = await import(process.env.SDK_PACKAGE_NAME);
          assert.equal(typeof sdk.createClient, "function", "ESM root export createClient");
          const client = sdk.createClient({ endpoint: "http://127.0.0.1:9" });
          for (const method of ["reportError", "reportNetworkError", "flush", "close"]) {
            assert.equal(typeof client[method], "function", `ESM client.${method}`);
          }
          await client.close();
          NODE
