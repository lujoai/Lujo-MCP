name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-locked.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ruff 硬门禁（v0.6.8 起）：规则集由仓库根 ruff.toml 显式锁定，
      # requirements-dev.txt 同时锁定 ruff>=0.16.4,<0.17.0 —— 二者共同消除
      # 「ruff 升级改默认规则集导致本地绿 / CI 红」的历史问题（v0.6.3 的 776 项即由此而来）。
      # 升级 ruff 时必须同步改 requirements-dev.txt 并在本地复验 ruff check . 全绿。
      - name: Lint with ruff
        run: ruff check .

      # 文档链接检查（硬门禁）：扫描 git 跟踪的 Markdown 文件中的
      # [text](url) 链接，验证相对路径文件是否存在、是否误用 file://
      # 绝对路径等。只检查 git ls-files 列出的文件，确保 CI 与本地一致。
      # 失败时在 GitHub Actions 的 Annotations 面板逐条标注错误位置。
      - name: Check doc links
        run: python scripts/check_doc_links.py

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short --junitxml=test-results.xml

      - name: Print skip summary (guard against all-skip false-green)
        if: always()
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("test-results.xml").getroot()
          except FileNotFoundError:
              print("::error::test-results.xml not found, cannot compute skip summary")
              sys.exit(1)

          suites = root.findall(".//testsuite") if root.tag == "testsuites" else [root]
          totals = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          for s in suites:
              for k in totals:
                  totals[k] += int(s.get(k, 0))

          passed = totals["tests"] - totals["skipped"] - totals["failures"] - totals["errors"]
          print(f"::notice::passed={passed}, skipped={totals['skipped']}, "
                f"failures={totals['failures']}, errors={totals['errors']}")

          # 全 skip 假绿：没有任何通过、没有任何失败/错误、却存在被跳过的用例
          if passed == 0 and totals["failures"] == 0 and totals["errors"] == 0 and totals["skipped"] > 0:
              print("::error::All tests were skipped — possible false-green! "
                    "请检查是否缺少依赖/环境导致用例整体被跳过。")
              sys.exit(1)
          EOF

  # SDK JS 核心契约 smoke（TST-3）：Node 无浏览器加载 ai-debug.js，守护
  # 公开 API 面 / V5 传输配置 / _getPublicConfig 不含 apiKey 等契约。
  # 防止 SDK 演进（如闭包化配置）后 e2e 接口再次失联（CI 不跑 Playwright e2e）。
  sdk-js-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 显式列出全部 SDK 测试文件（不用目录形式：node --test <dir> 在部分
      # Node 版本下按模块解析导致 MODULE_NOT_FOUND）。新增测试文件需在此登记，
      # 否则不受 CI 守护 —— v0.6.7 的传输修复测试曾因此漏出门禁。
      # FIX(v0.7.1-b1): 补登记 v0.6.9 漏掉的 sdk-destroy.test.js + 本批新增
      # sdk-minor-reuse.test.js，CI 与 npm test 文件清单保持一致。
      - name: Run SDK core contract tests
        run: >-
          node --test
          browser-sdk/test/sdk-core.test.js
          browser-sdk/test/sdk-events.test.js
          browser-sdk/test/sdk-transport.test.js
          browser-sdk/test/sdk-transport-fixes.test.js
          browser-sdk/test/sdk-batch-limit.test.js
          browser-sdk/test/sdk-destroy.test.js
          browser-sdk/test/sdk-minor-reuse.test.js
          browser-sdk/test/sdk-rejection.test.js

