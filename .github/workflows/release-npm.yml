name: Release npm

# 触发：手动运行 + 打 tag（如 v0.4.1-beta）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.4.1-beta）"
        required: true
        default: "0.4.1-beta"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # cancel-in-progress 必须为 false：发布中途取消会留下半发布状态
  # （部分平台包已上 npm、元包未发，且 npm 禁止覆盖已发布版本，无法原地重发——
  # v0.6.5 编码事故即此类窗口）。同 tag 重复触发时排队等待在途发布完成。
  cancel-in-progress: false

jobs:
  # ── 矩阵构建：每个平台原生打 PyInstaller 单文件二进制 ──
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: win32-x64
            artifact: lujo-mcp-server.exe
          - os: ubuntu-latest
            suffix: linux-x64
            artifact: lujo-mcp-server
          - os: macos-latest
            suffix: osx-arm64
            artifact: lujo-mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          pip install -r requirements-locked.txt
          # FIX: P2-F5 —— 固定 pyinstaller 版本：此前裸装取"最新"，每次发布构建
          # 可能在编译器/打包行为上漂移，导致产物不可复现。运行依赖由
          # requirements-locked.txt（== 锁定直接依赖）提供；构建工具在此处显式 pin。
          pip install "pyinstaller==6.11.1"

      - name: Build binary with PyInstaller
        shell: bash
        run: pyinstaller --clean -y packaging/lujo-mcp-server.spec

      - name: Verify binary exists
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/${{ matrix.artifact }}" || exit 1

      # FIX: P2-F7 —— 发布前运行时验证：此前只 test -f 校验文件存在，从不真正启动
      # 产出的二进制；hiddenimports/动态导入漏一项即为"发布即启动即崩"的包且无告警。
      # 这里在各自平台原生运行打包产物，走完整 stdio 冒烟（启动→initialize→tools/list
      # →tools/call），任一步骤失败即阻断构建。mcp_smoke_test.py 已支持 --cmd 指定启动命令。
      - name: Smoke test binary (runtime verification)
        shell: bash
        run: |
          set -e
          BIN="dist/${{ matrix.artifact }}"
          chmod +x "$BIN" 2>/dev/null || true
          python scripts/mcp_smoke_test.py --cmd "./$BIN"

      - name: Upload platform binary
        uses: actions/upload-artifact@v4
        with:
          name: lujo-mcp-${{ matrix.suffix }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # ── 组装平台包 + 发布到 npm ──
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@lujoai"

      # FIX: P2-F4 —— 不再把 ${{ github.event.inputs.version }} 直接拼进 shell。
      # 此前 workflow_dispatch 的 version 输入（仓库协作者可控）经 ${{ }} 在前置求值阶段
      # 内插进 run 脚本，含 $(...)/反引号时会在 runner shell 中执行任意命令（GitHub 官方
      # 反模式）。这里通过 env 把系统生成的 event_name / ref 与外部输入分开传递，shell
      # 内仅引用 $VAR，杜绝注入面。
      - name: Resolve version
        id: ver
        env:
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          TAGGED_REF: ${{ github.ref }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$IS_WORKFLOW_DISPATCH" = "true" ]; then
            echo "value=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
          else
            # 从 tag vX.Y.Z 提取 X.Y.Z
            echo "value=${TAGGED_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      # FIX: P1-F3 —— 发布版本与 app.__version__ 一致性硬校验。
      # 此前版本号完全来自 tag 名/手工输入，而二进制内的 __version__ 来自
      # app/__init__.py：打 tag v0.6.8 但忘改 app/__init__.py（仍是 0.6.7）
      # 会发布"npm 版本 0.6.8、MCP 握手 serverInfo 报 0.6.7"的错版包且无告警。
      - name: Verify version matches app.__version__
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          release_ver = os.environ["RELEASE_VERSION"]
          src = open("app/__init__.py", encoding="utf-8").read()
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', src)
          app_ver = m.group(1) if m else "<not found>"
          if app_ver != release_ver:
              print(
                  f"::error::Version mismatch: releasing {release_ver} but "
                  f"app/__init__.py __version__ is {app_ver}. Bump the version "
                  "set (app/__init__.py + browser-sdk/package.json + npm meta "
                  "+ 3 platform packages) before tagging."
              )
              sys.exit(1)
          print(f"Version consistency OK: {release_ver}")
          EOF

      - name: Generate platform package skeletons
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: node npm/scripts/gen-platform-packages.js "$RELEASE_VERSION"

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries into platform packages
        shell: bash
        run: |
          set -e
          declare -A map=(
            [win32-x64]=lujo-mcp-server.exe
            [linux-x64]=lujo-mcp-server
            [osx-arm64]=lujo-mcp-server
          )
          for suffix in "${!map[@]}"; do
            bin="artifacts/lujo-mcp-$suffix/${map[$suffix]}"
            dest="npm/packages/lujo-mcp-$suffix/bin/${map[$suffix]}"
            mkdir -p "$(dirname "$dest")"
            cp "$bin" "$dest"
            chmod +x "$dest"
            echo "placed $dest"
          done
          ls -la npm/packages/*/bin/

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -e
          ver="$RELEASE_VERSION"
          for d in npm/packages/lujo-mcp-win32-x64 npm/packages/lujo-mcp-linux-x64 npm/packages/lujo-mcp-osx-arm64; do
            name=$(node -p "require('./$d/package.json').name")
            echo "Publishing $name@$ver"
            npm publish "$d" --access public --tag latest
          done

      - name: Publish meta package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          ver="$RELEASE_VERSION"
          node -e "
            const fs=require('fs');
            const p='npm/packages/lujo-mcp/package.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.version='$ver';
            if (j.optionalDependencies) {
              for (const k of Object.keys(j.optionalDependencies)) {
                j.optionalDependencies[k]='$ver';
              }
            }
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          npm publish "npm/packages/lujo-mcp" --access public --tag latest

      - name: Tag npm release (optional success notice)
        run: echo "Published lujo-mcp@${{ steps.ver.outputs.value }} to npm ✅"
