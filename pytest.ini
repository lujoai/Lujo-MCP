[pytest]
testpaths = tests
addopts = -q
markers =
    integration: 集成测试（依赖外部服务或跨模块协作）
    llm: 需要 LLM API Key 的端到端测试
    pg: 依赖 PostgreSQL 的测试
    slow: 执行耗时较长的测试
filterwarnings =
    ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning
    ignore::DeprecationWarning:pytest_asyncio
