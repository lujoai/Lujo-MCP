<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="Segoe UI, Arial, sans-serif">
  <title>Lujo-MCP Runtime Context Architecture</title>
  <!-- Lujo-MCP = Context Provider, not an Agent -->

  <!-- AI Coding Agent -->
  <rect x="210" y="20" width="300" height="70" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="360" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#174ea6">AI Coding Agent</text>
  <text x="360" y="72" text-anchor="middle" font-size="13" fill="#4285f4">Claude / Cursor / Trae</text>

  <!-- MCP label -->
  <text x="360" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#5f6368">MCP (stdio / HTTP)</text>
  <line x1="360" y1="92" x2="360" y2="108" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="132" x2="360" y2="150" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lujo-MCP Server -->
  <rect x="180" y="150" width="360" height="80" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="360" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#e37400">Lujo-MCP Runtime Debug Context Server</text>
  <text x="360" y="200" text-anchor="middle" font-size="13" fill="#f9ab00">Context Provider（不是 Agent）</text>
  <text x="360" y="218" text-anchor="middle" font-size="12" fill="#b06000">采集 → 组装 → 通过 MCP 提供给宿主 AI</text>

  <!-- arrow down -->
  <line x1="360" y1="232" x2="360" y2="252" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Runtime Context Collection -->
  <rect x="60" y="252" width="600" height="250" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="360" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c4043">Runtime Context Collection</text>

  <!-- collection items -->
  <rect x="90" y="300" width="250" height="56" rx="8" fill="#ffffff" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="215" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Browser SDK</text>
  <text x="215" y="346" text-anchor="middle" font-size="12" fill="#5f6368">console logs · UI events · silent failures</text>

  <rect x="380" y="300" width="250" height="56" rx="8" fill="#ffffff" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="505" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Backend Trace</text>
  <text x="505" y="346" text-anchor="middle" font-size="12" fill="#5f6368">request tracing · runtime snapshot</text>

  <rect x="90" y="372" width="250" height="56" rx="8" fill="#ffffff" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="215" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Network · Console</text>
  <text x="215" y="418" text-anchor="middle" font-size="12" fill="#5f6368">network failures · console errors</text>

  <rect x="380" y="372" width="250" height="56" rx="8" fill="#ffffff" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="505" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Errors · Runtime Snapshot</text>
  <text x="505" y="418" text-anchor="middle" font-size="12" fill="#5f6368">exceptions · stacktrace · process state</text>

  <!-- footnote -->
  <text x="360" y="472" text-anchor="middle" font-size="13" fill="#5f6368">Lujo-MCP 只提供 Debug Context，不负责自主推理 / 决定修复方案</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
</svg>
