services:
  redis:
    image: redis:7-alpine
    container_name: lujo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - lujo-internal-network

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lujo-mcp-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # W10 / P2-SEC-1：app/config.py 的 host 默认值已收紧为 127.0.0.1（单用户
      # 本地定位）。容器内必须显式绑 0.0.0.0，否则服务只监听容器回环、下方
      # ports 发布与 prometheus 的容器间抓取都会打不通（healthcheck 在容器内
      # 跑，仍会显示健康 → 故障极难发现）。对外暴露面由 ports 的 127.0.0.1
      # 发布地址控制。
      HOST: 0.0.0.0
      # WP6（Step 3）：PostgreSQL 服务已移除，运行时后端固定 memory
      # （KB 经验由本地 SQLite 笔记本持久化，KB_PERSIST_ENABLED 默认开启）
      STORAGE_BACKEND: memory
      STATE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      # M2-CONFIGSYNC：0.2 为 84a296f 批量 sync 引入的无依据漂移（公开
      # preflight/TROUBLESHOOTING 文档推荐值均为 0.3），对齐 config.py 权威默认。
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      API_KEY: ${API_KEY:?必须设置 API_KEY}
      SOURCEMAP_ENABLED: ${SOURCEMAP_ENABLED:-true}
    # FIX: P2-F1 —— 端口仅绑定回环 127.0.0.1，不向公网/局域网发布 app 端口
    # （此前全网开放 => API Key 明文 HTTP 传输且入口无 TLS）。
    # 生产 TLS 终止由前置反代（nginx/ALB/tunnel 等）在同一宿主机上完成，
    # 反代可通过 127.0.0.1:8000 反代到 app（与下方 prometheus 一致的分有界发布）。
    ports:
      - "127.0.0.1:${LUJO_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lujo-internal-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lujo-prometheus
    restart: unless-stopped
    environment:
      # W10 / P2-SEC-2：/metrics 的免鉴权豁免现在只在**回环绑定**时成立。容器内
      # app 必须绑 0.0.0.0（见上方 HOST 说明），故抓取要带 API Key —— 经
      # --config.expand-env 从本变量展开，避免把密钥明文写进 prometheus.yml。
      LUJO_API_KEY: ${API_KEY:?必须设置 API_KEY}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--config.expand-env=true"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    # 安全：Prometheus 无内置认证。
    # 1) 端口仅绑定 loopback，不对公网/局域网发布（容器间仍走内部网络抓取）；
    # 2) 不启用 --web.enable-lifecycle（无认证的远程 reload/quit 端点），
    #    配置变更通过容器重启完成。
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    networks:
      - lujo-internal-network

volumes:
  redisdata:
  promdata:

networks:
  # FIX: lujo-internal-network 原为零缩进（被解析为顶层键，networks 值为 null），
  # 服务引用的网络实际未定义；缩进回归 networks 子键层级
  lujo-internal-network:
    driver: bridge
