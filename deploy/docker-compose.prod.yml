version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lujo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-lujo_mcp}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?必须设置 PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-lujo_mcp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # FIX: 此处 networks 原为零缩进（被解析为顶层键），导致整个文件 YAML 解析
    # 失败、docker compose 无法加载；缩进回归 postgres 服务层级（与 redis/app 一致）
    networks:
      - lujo-internal-network

  redis:
    image: redis:7-alpine
    container_name: lujo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - lujo-internal-network

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lujo-mcp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: postgresql
      STATE_BACKEND: redis
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-lujo_mcp}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?必须设置 PG_PASSWORD}
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-20}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      API_KEY: ${API_KEY:?必须设置 API_KEY}
      SOURCEMAP_ENABLED: ${SOURCEMAP_ENABLED:-true}
      PROMETHEUS_ENABLED: "true"
    ports:
      - "${LUJO_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lujo-internal-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lujo-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    # 安全：Prometheus 无内置认证。
    # 1) 端口仅绑定 loopback，不对公网/局域网发布（容器间仍走内部网络抓取）；
    # 2) 不启用 --web.enable-lifecycle（无认证的远程 reload/quit 端点），
    #    配置变更通过容器重启完成。
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    networks:
      - lujo-internal-network

volumes:
  pgdata:
  redisdata:
  promdata:

networks:
  # FIX: lujo-internal-network 原为零缩进（被解析为顶层键，networks 值为 null），
  # 服务引用的网络实际未定义；缩进回归 networks 子键层级
  lujo-internal-network:
    driver: bridge
